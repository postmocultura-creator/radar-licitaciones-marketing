name: Actualizar datos del radar

# Corre a diario sin depender de ningún ordenador encendido (ver README,
# sección "Automatización"). El horario evita en punto/y media a propósito
# (buena práctica para no coincidir con la avalancha de jobs que arrancan
# justo a esas horas en todo GitHub).
#
# 22:47 UTC (no 5:13 UTC como al principio): GitHub retrasa los triggers
# "schedule" bajo carga, más en repos con poca actividad como este -se
# comprobó en la práctica: las primeras ejecuciones automáticas llegaron
# entre 4h30 y 6h25 tarde respecto a la hora objetivo-. El requisito real es
# tener datos frescos antes de las 9:00 en España (07:00 UTC en horario de
# verano, 08:00 en invierno), así que el disparo se adelanta a la noche
# anterior con margen de sobra (~8h) para absorber ese retraso incluso en el
# peor caso observado.
on:
  schedule:
    - cron: "47 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Evita que dos ejecuciones de este workflow corran a la vez (p. ej. un
# lanzamiento manual justo cuando toca el cron) y se pisen entre sí al hacer
# push casi al mismo tiempo. En cola, no cancelado, porque cada ejecución
# hace su propio scraping — no tiene sentido tirar el trabajo de una a medias.
concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    # El límite del job es la SUMA de los límites de sus pasos, más margen:
    # así ningún paso lento puede impedir que se llegue a "Publicar cambios".
    # Antes era un límite global de 90 minutos y, cuando PLACSP servía lento
    # (pasa de día y alguna noche: 0,1-0,2 MB/s en vez de ~1), el job se
    # cortaba a media tarea y ese día no se publicaba NADA, ni siquiera lo
    # que sí se había descargado bien (2026-09-29, 2026-10-02 y la noche del
    # 2026-10-03, con el paso de PLACSP en 68 minutos). Ahora cada fuente
    # tiene su propio límite: si se pasa, ese día se queda con lo acumulado
    # de días anteriores y el resto se publica igual. Una noche normal sigue
    # tardando unos 25-35 minutos; el límite solo se alcanza si algo falla.
    # Pasos: 10+40+30+20+20+25+10+15 = 170, más la instalación y margen.
    timeout-minutes: 185
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Cada scraper guarda su propio _error.json y no debe tumbar a los
      # demás (ver README, "Si una fuente cambia de formato") — por eso
      # continue-on-error aquí: si una fuente falla, clasificar.py sigue
      # con las que sí trajeron datos.
      - name: Scraper TED
        timeout-minutes: 10
        run: python scrapers/ted.py
        continue-on-error: true

      # Lo normal son 5-8 minutos (unos 350 MB a final de mes). 40 cubren una
      # noche lenta (a 0,2 MB/s); si ni así, clasificar.py sigue con lo
      # acumulado de PLACSP y el buscador web cubre lo publicado ese día.
      - name: Scraper PLACSP
        timeout-minutes: 40
        run: python scrapers/placsp.py
        continue-on-error: true

      # Aviso temprano: lo publicado hoy/ayer en el buscador web de PLACSP,
      # que no depende de los lotes de exportación del feed (ver
      # scrapers/placsp_web.py). Necesita un Chromium sin interfaz.
      - name: Scraper PLACSP web (aviso temprano)
        # Límite propio: si la web de PLACSP va muy lenta no puede comerse
        # el tiempo del job y dejar el día sin publicar. Si se corta, el
        # radar sigue con el feed y con lo acumulado de días anteriores.
        # Los lunes hace además la pasada de convocatorias de plazo largo
        # (unas 15 páginas más), después de guardar lo diario: de ahí los 30
        # minutos, y si esa pasada se corta no se pierde la búsqueda del día.
        timeout-minutes: 30
        run: |
          python -m playwright install --with-deps chromium
          python scrapers/placsp_web.py
        continue-on-error: true

      - name: Scraper Euskadi
        timeout-minutes: 20
        run: python scrapers/euskadi.py
        continue-on-error: true

      # El scraper de la UE pide el detalle de cada convocatoria (unas 600
      # peticiones, 15 minutos a una por segundo). Los detalles se conservan
      # de una noche a otra y solo se piden los nuevos (ver eu_grants.py).
      # En data/cache van también las traducciones automáticas de
      # normalizar.py. Restaurar y guardar van separados para que la caché se
      # guarde nada más terminar cada paso que la usa, aunque después falle
      # otro (con un solo paso actions/cache se guarda al final del job, y si
      # el job se cortaba no se guardaba nunca: pasó la noche del
      # 2026-10-03). La clave lleva el número de ejecución para que cada
      # noche guarde una nueva; se restaura la más reciente. "eu-grants-
      # detalle-" es el nombre anterior de la caché: se lee si no hay otra.
      - name: Restaurar cachés
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: datos-cache-${{ github.run_id }}-a
          restore-keys: |
            datos-cache-
            eu-grants-detalle-

      - name: Scraper calls for proposals UE
        timeout-minutes: 20
        run: python scrapers/eu_grants.py
        continue-on-error: true

      - name: Guardar cachés (convocatorias UE)
        if: ${{ !cancelled() && hashFiles('data/cache/eu_grants_detalle.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: datos-cache-${{ github.run_id }}-a

      # Histórico de adjudicaciones: se alimenta cada día con lo que los
      # scrapers de arriba ya han descargado (los ZIP de PLACSP del mes), más
      # lo pequeño (plataformas agregadas, TED del año, un mes de menores de
      # Euskadi en rotación). No hay actualización semanal aparte. Si falla,
      # el radar se publica igual y el histórico se queda como estaba.
      - name: Histórico de adjudicaciones
        id: historico
        timeout-minutes: 25
        run: python scrapers/historico_adjudicaciones.py diario
        continue-on-error: true

      - name: Clasificar
        timeout-minutes: 10
        run: python clasificar.py

      # Normal: menos de un minuto. El límite cubre un traductor lento.
      - name: Normalizar
        timeout-minutes: 15
        run: python normalizar.py

      - name: Guardar cachés (traducciones)
        if: ${{ !cancelled() && hashFiles('data/cache/traducciones_auto.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: datos-cache-${{ github.run_id }}-b

      # Si varias fuentes fallan a la vez (p. ej. un corte de red puntual
      # en el runner), el dataset resultante puede quedar sospechosamente
      # vacío. Mejor no publicar nada ese día -y que el job aparezca en
      # rojo para que se note- que pisar los datos buenos de ayer con un
      # resultado casi vacío.
      - name: Comprobación de cordura antes de publicar
        run: |
          python -c "
          import json, sys
          data = json.load(open('data/tenders.json', encoding='utf-8'))
          if len(data) < 100:
              print(f'Solo {len(data)} registros, sospechosamente pocos. No se publica.', file=sys.stderr)
              sys.exit(1)
          print(f'{len(data)} registros, OK para publicar.')
          "

      # El scraping tarda 15-30 minutos; en ese rato puede haber caído un
      # commit nuevo en main (código, o un push manual) que deja a este job
      # por detrás del remoto -pasó de verdad en la primera prueba real, un
      # push mío mientras corría el workflow hizo que "git push" fallara con
      # "fetch first"-. Se resuelve con fetch + reset justo antes de
      # comitear: el commit de este job siempre se basa en el main más
      # reciente, y como los ficheros de datos se regeneran por completo en
      # cada ejecución, "el más nuevo gana" es la semántica correcta.
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # "reset" normal, NO "--soft": --soft dejaba en el índice el código
          # tal como estaba al empezar la ejecución, y si entretanto se subía
          # código nuevo, el commit de datos lo revertía en silencio (pasó el
          # 2026-09-30; GitHub lo rechazó solo porque tocaba este workflow).
          # Así el commit parte de origin/main y solo añade los datos.
          git reset origin/main
          git add data/tenders.json dashboard/tenders-data.js data/primera_aparicion.json data/ultimo_bueno_por_fuente.json
          # Solo existe si el scraper web ha funcionado alguna vez.
          if [ -f data/placsp_web_acumulado.json ]; then git add data/placsp_web_acumulado.json; fi
          # Menores de Euskadi leídos por meses (euskadi.actualizar_menores).
          if [ -f data/euskadi_menores_acumulado.json ]; then git add data/euskadi_menores_acumulado.json; fi
          # Solo si el paso del histórico terminó bien: si se cortó a medias,
          # no se publican ficheros a medio escribir.
          if [ "${{ steps.historico.outcome }}" = "success" ]; then
            git add data/historico_adjudicaciones.json dashboard/historico-data.js dashboard/historico-detalle
          fi
          git diff --cached --quiet && echo "Sin cambios que publicar" || git commit -m "Actualización automática de datos $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
