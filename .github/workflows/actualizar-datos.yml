name: Actualizar datos del radar

# Corre a diario sin depender de ningún ordenador encendido (ver README,
# sección "Automatización"). El horario evita en punto/y media a propósito
# (buena práctica para no coincidir con la avalancha de jobs que arrancan
# justo a esas horas en todo GitHub).
on:
  schedule:
    - cron: "13 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Evita que dos ejecuciones de este workflow corran a la vez (p. ej. un
# lanzamiento manual justo cuando toca el cron) y se pisen entre sí al hacer
# push casi al mismo tiempo. En cola, no cancelado, porque cada ejecución
# hace su propio scraping — no tiene sentido tirar el trabajo de una a medias.
concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Cada scraper guarda su propio _error.json y no debe tumbar a los
      # demás (ver README, "Si una fuente cambia de formato") — por eso
      # continue-on-error aquí: si una fuente falla, clasificar.py sigue
      # con las que sí trajeron datos.
      - name: Scraper TED
        run: python scrapers/ted.py
        continue-on-error: true

      - name: Scraper PLACSP
        run: python scrapers/placsp.py
        continue-on-error: true

      - name: Scraper Euskadi
        run: python scrapers/euskadi.py
        continue-on-error: true

      - name: Scraper calls for proposals UE
        run: python scrapers/eu_grants.py
        continue-on-error: true

      - name: Clasificar
        run: python clasificar.py

      - name: Normalizar
        run: python normalizar.py

      # Si varias fuentes fallan a la vez (p. ej. un corte de red puntual
      # en el runner), el dataset resultante puede quedar sospechosamente
      # vacío. Mejor no publicar nada ese día -y que el job aparezca en
      # rojo para que se note- que pisar los datos buenos de ayer con un
      # resultado casi vacío.
      - name: Comprobación de cordura antes de publicar
        run: |
          python -c "
          import json, sys
          data = json.load(open('data/tenders.json', encoding='utf-8'))
          if len(data) < 100:
              print(f'Solo {len(data)} registros, sospechosamente pocos. No se publica.', file=sys.stderr)
              sys.exit(1)
          print(f'{len(data)} registros, OK para publicar.')
          "

      # El scraping tarda 15-30 minutos; en ese rato puede haber caído un
      # commit nuevo en main (código, o un push manual) que deja a este job
      # por detrás del remoto -pasó de verdad en la primera prueba real, un
      # push mío mientras corría el workflow hizo que "git push" fallara con
      # "fetch first"-. Se resuelve con fetch + reset --soft justo antes de
      # comitear: el commit de este job siempre se basa en el main más
      # reciente, y como estos dos ficheros son datos regenerados por
      # completo en cada ejecución (no código con lógica que fusionar), no
      # hay nada que conservar del estado anterior — "el más nuevo gana" es
      # exactamente la semántica correcta aquí.
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add data/tenders.json dashboard/tenders-data.js data/primera_aparicion.json
          git diff --cached --quiet && echo "Sin cambios que publicar" || git commit -m "Actualización automática de datos $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
